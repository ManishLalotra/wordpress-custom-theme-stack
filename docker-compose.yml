version: '3.8'

services:
  wordpress:
    image: wordpress:6.5-php8.2-fpm-alpine
    container_name: wp-stack-app
    restart: unless-stopped
    volumes:
      - ./theme/manish-enterprise:/var/www/html/wp-content/themes/manish-enterprise
      - wp_core:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_secure_password
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: wp-stack-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - wp_core:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress

  db:
    image: mysql:8.0
    container_name: wp-stack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_secure_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    volumes:
      - wp_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wp_core:
  wp_db_data:
